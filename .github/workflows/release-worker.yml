name: Release worker

# tag 发布门禁:先跑与 ci.yml 相同的 typecheck + 单测,再校验 tag 与 package.json 版本一致,
# 最后打包 + 建 Release。任一步失败 → 不产出 Release(避免发布坏产物)。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 版本由 package.json 的 packageManager 字段决定(与 ci.yml 同源,不再两处各写一个)。
      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || {
            echo "package.json=$pkg, tag=$tag" >&2
            exit 1
          }

      - name: "Typecheck (root, 13 packages)"
        run: pnpm typecheck

      - name: "Unit tests (vitest, 含分层守护)"
        run: pnpm test

      - name: Build bundle
        run: pnpm bundle

      - name: Build web UI
        run: cd packages/web && pnpm install --frozen-lockfile && pnpm typecheck && pnpm build

      - name: Build worker archives
        run: scripts/build-worker-release.sh --version "${GITHUB_REF_NAME#v}" --arch all

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/releases/*.tar.gz \
            dist/releases/*.sha256 \
            --clobber
